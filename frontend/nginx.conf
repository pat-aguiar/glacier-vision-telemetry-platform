# Only set the Connection header to "upgrade" for actual WebSocket upgrade
# requests (non-empty Upgrade header); plain HTTP requests through the same
# /api/ location get "close" instead of a hardcoded "upgrade".
# https://nginx.org/en/docs/http/websocket.html
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Must stay reachable over plain HTTP, unredirected -- this is how
    # Certbot's webroot method proves domain control on every renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/23-20-203-22.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/23-20-203-22.sslip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: unmatched paths resolve client-side, not as 404s.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
