name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://telemetry:ci_test_password@localhost:5432/telemetry
      EDGE_API_KEY: ci_test_edge_api_key
      DASHBOARD_ACCESS_TOKEN: ci_test_dashboard_access_token
      CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run migrations
        run: |
          source .venv/bin/activate
          alembic upgrade head

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Run tests
        run: npm run test
